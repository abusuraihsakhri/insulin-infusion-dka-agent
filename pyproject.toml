[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "insulin-infusion-dka-engine"
version = "2.0.1"
description = "DKAGuard: Diabetic Ketoacidosis & HHS Insulin Infusion / Potassium Sentinel"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
insulin-infusion-dka-engine = "insulin_infusion_dka_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/insulin-infusion-dka-agent"
Repository = "https://github.com/abusuraihsakhri/insulin-infusion-dka-agent.git"

[tool.setuptools]
py-modules = ["dka_guard", "enrichment", "simulator", "cli"]

[tool.setuptools.packages.find]
include = ["agents*", "insulin_infusion_dka_agent*"]
