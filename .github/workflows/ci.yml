name: Tests, packaging and security checks

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
      - name: Verify Python syntax
        run: python -m compileall -q agents insulin_infusion_dka_agent cli.py dka_guard.py enrichment.py
      - name: Run Python tests
        run: python -m pytest -q
      - name: Run standalone browser calculation tests
        run: node --test tests/test_browser_math.mjs
      - name: Package distribution smoke test
        run: |
          python -m pip install build
          python -m build
      - name: Dependency vulnerability audit
        run: |
          python -m pip install pip-audit
          pip-audit

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare standalone static site
        run: |
          mkdir -p _site
          cp index.html app.mjs dka_math.mjs _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
